[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-studio-v4"
version = "0.1.0"
description = "AI Studio V4 industrial AI comic production platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
    "pyinstaller>=6.8,<7",
]

[project.scripts]
ai-studio-v4 = "ai_studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
