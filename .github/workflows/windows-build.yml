name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Build EXE
        run: pyinstaller --noconfirm --clean AI_Studio_V4.spec

      - name: Launch smoke test
        shell: powershell
        run: |
          $marker = Join-Path $PWD "startup-ok.txt"
          if (Test-Path $marker) { Remove-Item $marker -Force }

          $env:AI_STUDIO_SMOKE_MARKER = $marker
          $process = Start-Process `
            -FilePath "dist\AI_Studio_V4\AI_Studio_V4.exe" `
            -PassThru

          $started = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1

            if (Test-Path $marker) {
              $started = $true
              break
            }

            if ($process.HasExited) {
              throw "EXE exited during startup. Exit code: $($process.ExitCode)"
            }
          }

          if (-not $started) {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            throw "EXE did not create the startup marker."
          }

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

          Remove-Item $marker -Force -ErrorAction SilentlyContinue

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-V4-Windows
          path: dist/AI_Studio_V4/
          if-no-files-found: error
